[package]
name = "buzz-rap"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/TheBeaninator/buzz-rap"
description = "The buzz CLI as a RAP (Reactive Agent Protocol) tool server"
keywords = ["buzz", "nostr", "agents", "rap"]

[[bin]]
name = "buzz-rap"
path = "src/main.rs"

[dependencies]
# The command tree the toolset is generated from. buzz_cli::command() is the one upstream addition buzz-rap needs
# (patches/0001-buzz-cli-export-command.patch); until block/buzz has it, this pins the commit that adds it on top of
# upstream main. In the Buzz workspace this line becomes a path dependency (scripts/into-buzz-tree.sh).
buzz-cli = { git = "https://github.com/TheBeaninator/buzz", rev = "6f9e216e1e0d03820b56bf7e4886acbfad54af9e" }
clap = { version = "4", features = ["derive", "env"] }

# HTTP server for the manifest and invocations, client for callbacks
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Our own public key, so a subscription does not echo the agent's own posts
nostr = "0.44"
